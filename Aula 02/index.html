<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 02</title>
</head>

<body>
    <h1>Lista de compras</h1>
    <input type="text" id="txtNome" placeholder="Nome do produto">
    <input type="text" id="txtPreco" placeholder="Preço do produto">
    <button onclick="add()">+</button>

    <hr>

    <ul id="listaProdutos"></ul>
    <div id="divTotalProdutos"></div>

    <hr>
    <h1>Leitura de dados</h1>

    <input type="text" id="entradaNome" placeholder="Digite um nome">
    <input type="text" id="entradaPeso" placeholder="Digite um peso">
    <input type="text" id="entradaAltura" placeholder="Digite uma altura">

    <button onclick="lerDados()">Ler dados</button>
    <div id="divDados"></div>

    <script src="script.js"></script>
</body>

</html>
